spring:
  application:
    name: khetconnect-backend
  datasource:
    # Use in-memory H2 for local dev to avoid file locks; override with
    # environment-specific URL in production if needed.
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:khetconnect;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driver-class-name: org.h2.Driver
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:20}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
        jdbc:
          batch_size: 10
          fetch_size: 50
        order_updates: true
        order_inserts: true

server:
  port: ${SERVER_PORT:8081}
  compression:
    enabled: true
    min-response-size: 1024
  servlet:
    session:
      cookie:
        secure: ${SERVER_SERVLET_SESSION_COOKIE_SECURE:false}
        http-only: true
        same-site: strict

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    khetconnect: ${LOGGING_LEVEL_KHETCONNECT:DEBUG}
  file:
    name: ${LOGGING_FILE:logs/spring.log}
  pattern:
    file: '%d{yyyy-MM-dd HH:mm:ss} - %msg%n'
    console: '%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

khetconnect:
  jwt:
    secret: ${JWT_SECRET_KEY:must-be-32-chars-in-production-do-not-use-default}
    expiry-ms: ${JWT_EXPIRY_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
  fcm:
    enabled: ${KHETCONNECT_FCM_ENABLED:false}

firebase:
  service-account-path: ${GOOGLE_APPLICATION_CREDENTIALS:}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info,swagger-ui,openapi
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:when-authorized}
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /api/v1/docs
  swagger-ui:
    path: /api/v1/swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    use-root-path: false
  show-actuator: true
