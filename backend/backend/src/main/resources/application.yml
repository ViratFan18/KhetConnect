spring:
  application:
    name: khetconnect-backend
  datasource:
    # Use in-memory H2 for local dev to avoid file locks; override with
    # environment-specific URL in production if needed.
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:khetconnect;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

khetconnect:
  jwt:
    secret: ${JWT_SECRET:khetconnect-dev-secret-key-change-in-production-32chars}
    expiry-ms: ${JWT_EXPIRY_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
  fcm:
    server-key: ${FCM_SERVER_KEY:}
