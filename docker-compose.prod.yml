version: '3.8'

# Production Docker Compose Configuration
# DO NOT USE FOR LOCAL DEVELOPMENT - Use docker-compose.yml instead
# 
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d
#   docker-compose -f docker-compose.prod.yml down
#   docker-compose -f docker-compose.prod.yml logs -f backend

services:
  # ========================================
  # BACKEND SERVICE (Spring Boot)
  # ========================================
  backend:
    image: khetconnect-backend:latest
    container_name: khetconnect-backend-prod
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M
    
    ports:
      - "8080:8080"
      - "9090:9090"  # Metrics port
    
    environment:
      # Database Configuration
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 20
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 5
      
      # Security
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRY_MS: 86400000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      
      # Server Configuration
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: production
      SERVER_SERVLET_SESSION_COOKIE_SECURE: 'true'
      
      # Logging
      LOGGING_LEVEL_ROOT: WARN
      LOGGING_LEVEL_KHETCONNECT: INFO
      LOGGING_FILE: /var/log/khetconnect/spring.log
      
      # Firebase/FCM
      KHETCONNECT_FCM_ENABLED: 'true'
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase-key.json
      
      # Database DDL
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: 'false'
      
      # H2 Console (disabled in production)
      H2_CONSOLE_ENABLED: 'false'
      
      # Management
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: when-authorized
    
    volumes:
      # Firebase service account (mount from host)
      - ${FIREBASE_KEY_PATH:-./firebase-key.json}:/app/firebase-key.json:ro
      # Application logs
      - backend_logs:/var/log/khetconnect
      # Temporary data
      - backend_data:/app/data
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Restart policy
    restart: unless-stopped
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    networks:
      - khetconnect-network

  # ========================================
  # FRONTEND SERVICE (Nginx)
  # ========================================
  frontend:
    image: khetconnect-frontend:latest
    container_name: khetconnect-frontend-prod
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    
    ports:
      - "80:80"
      - "443:443"
    
    environment:
      # API Configuration (passed to Nginx via envsubst)
      VITE_API_URL: ${VITE_API_URL:-http://backend:8080/api}
    
    volumes:
      # Nginx configuration
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
      # SSL certificates (if using HTTPS)
      - ./certs:/etc/nginx/certs:ro
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Restart policy
    restart: unless-stopped
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Wait for backend to be healthy
    depends_on:
      backend:
        condition: service_healthy
    
    networks:
      - khetconnect-network

  # ========================================
  # OPTIONAL: Prometheus Monitoring
  # ========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: khetconnect-prometheus
    
    environment:
      TZ: UTC
    
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    
    ports:
      - "9090:9090"
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    
    restart: unless-stopped
    
    depends_on:
      - backend
    
    networks:
      - khetconnect-network

  # ========================================
  # OPTIONAL: Grafana Dashboard
  # ========================================
  grafana:
    image: grafana/grafana:latest
    container_name: khetconnect-grafana
    
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    
    ports:
      - "3000:3000"
    
    restart: unless-stopped
    
    depends_on:
      - prometheus
    
    networks:
      - khetconnect-network

# ========================================
# VOLUMES
# ========================================
volumes:
  backend_logs:
    driver: local
  backend_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ========================================
# NETWORKS
# ========================================
networks:
  khetconnect-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
